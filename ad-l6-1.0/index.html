
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Lab</title>

    <!-- Task 1: Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="style.css" rel="stylesheet">
</head>

<body>

    <!-- Task 2: Fluid Container -->
    <div class="container-fluid">

        <h1>Bootstrap Lab</h1>

        <!-- Task 3: Buttons -->
        <h2>Task 3: Buttons</h2>

        <button class="btn btn-primary">Blue</button>
        <button class="btn btn-success">Green</button>
        <button class="btn btn-danger">Red</button>

        <hr>

        <!-- Task 4: Text Alignment -->
        <h2>Task 4: Text Alignment</h2>

        <p class="text-start">Left</p>
        <p class="text-center text-danger">Center</p>
        <p class="text-end">Right</p>

        <hr>

        <!-- Task 5: Card -->
        <h2>Task 5: Fruit Card</h2>

        <div class="card" style="width: 18rem;">

            <div class="card-header">
                Task card.
            </div>

            <img src="https://images.unsplash.com/photo-1619566636858-adf3ef46400b?w=500"
                 class="card-img-top"
                 alt="Fruits">

            <ul class="list-group list-group-flush">
                <li class="list-group-item">Apple</li>
                <li class="list-group-item">Orange</li>
                <li class="list-group-item">Banana</li>
            </ul>

        </div>

    </div>

    <!-- Task 1: Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
